<!doctype html><meta charset="utf-8"><title>FLOW bar page</title>
<script type="importmap">{ "imports": {
  "live-layer-protocol/": "/node_modules/live-layer-protocol/",
  "@noble/post-quantum/": "/node_modules/@noble/post-quantum/",
  "@noble/hashes/": "/node_modules/@noble/hashes/",
  "@noble/curves/": "/node_modules/@noble/curves/"
} }</script>
<body><div id="screen"></div><div style="height:3000px"></div>
<script type="module">
// A FLOW app in a real browser: the FLOW verifier, the LLP host and FLOW's own page presenter all run here.
import { FlowHost } from "/src/host.js";
import { present } from "/src/present/dom.js";
import { generateKey } from "/src/suites.js";
import { keyringDoc, sealKeyring, sealRelease, sealFunction } from "/src/author.js";
import { sha256hex } from "/src/bytes.js";

const app = "demo.tasks";
const [r1, rel, outsider, ana] = await Promise.all([1, 2, 3, 4].map(() => generateKey("p256")));
const [q1, spare] = await Promise.all([generateKey("slh-dsa-sha2-128s"), generateKey("slh-dsa-sha2-128s")]);
const keyring = await sealKeyring(keyringDoc({ keyring: 1, app, spare, roles: { root: [{ keys: [r1] }, { keys: [q1] }], release: [{ keys: [rel] }] } }), [r1, q1]);
const blobs = new Map();
const load = async (f) => { const b = new Uint8Array(await (await fetch("/layers/" + f)).arrayBuffer()); const h = sha256hex(b); blobs.set(h, b); return h; };
const [v1, v2, streak, streak2] = await Promise.all(["tasks.wasm", "tasks_v2.wasm", "streak.wasm", "streak_v2.wasm"].map(load));
const host = await FlowHost.create({ keyring });
present(host, document.getElementById("screen"));
const fetchBlob = async (h) => blobs.get(h);
const release = (version, hash, signer = rel) => sealRelease({ app, manifest: { app, version, layers: { main: hash }, order: ["main"], keys: { main: { own: ["tasks.", "draft", "migrated."] } }, caps: { main: ["haptic"] } },
  data: { "tasks.": "personal", "draft": "personal" }, capabilities: { haptic: { egress: false } }, core: ["main"], directions: { panel: { read: ["tasks."], caps: [], after: "main" } } }, [signer]);
const pre = { v2: await release(2, v2), back: await release(3, v1), forged: await release(4, v1, outsider) };
host.enrolPerson({ ...ana, name: "Ana" });
const mine = { v1: await sealFunction({ app, direction: "panel", id: "streak", seq: 1, layer: streak, reads: ["tasks."] }, ana), v2: await sealFunction({ app, direction: "panel", id: "streak", seq: 2, layer: streak2 }, ana) };
window.flow = {
  first: await host.apply(await release(1, v1), fetchBlob),
  ship: (name) => host.apply(pre[name], fetchBlob),
  mine: (name) => host.installFunction(mine[name], fetchBlob),
  undoMine: () => host.undoFunction("fn.panel.streak"),
  ledger: () => host.ledger,
  version: () => host.version,
};
window.__ready = true;
</script></body>
